name: Run Python Script

on:
  # Choose when to trigger the workflow
  schedule:
    - cron: '0 8 * * *'  # Runs at 08:00 AM UTC, which is 04:00 AM EDT. A manual switch to EST is required which would be 9:00 AM UTC. 
  # Optional: manual trigger
  workflow_dispatch:
    inputs:
      commit_timestamp:
        description: 'Commit last_record_timestamp.txt? (treat this manual run as a real PGH failover)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git log freshness check

      - name: Skip if EGH recently synced timestamp
        id: freshness_check
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct -- last_record_timestamp.txt)
          NOW=$(date +%s)
          if [ -z "$LAST_COMMIT" ]; then
            echo "No commit history for last_record_timestamp.txt — proceeding as fallback."
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          HOURS_AGO=$(( (NOW - LAST_COMMIT) / 3600 ))
          echo "Timestamp file last committed $HOURS_AGO hours ago"
          if [ "$HOURS_AGO" -lt 6 ]; then
            echo "EGH synced recently — skipping PGH run."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "EGH hasn't synced in $HOURS_AGO hours — proceeding as fallback."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.10.12
        if: steps.freshness_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.12'

      - name: Install Kerberos Dependencies
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev

      - name: Install Python Dependencies
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade numpy==1.24.2
          pip install gssapi==1.9.0
          pip install arcgis==2.2.0
          pip install pandas==2.0.3
          pip install pyarrow==13.0.0
          pip install requests==2.26.0
          pip install fiona==1.9.4
          pip install geopandas==0.13.2
          pip list

      - name: Run Backend Script
        if: steps.freshness_check.outputs.skip != 'true'
        env:
          ARCGIS_CLIENT_ID: ${{ secrets.ARCGIS_CLIENT_ID }}
          ARCGIS_CLIENT_SECRET: ${{ secrets.ARCGIS_CLIENT_SECRET }}
          ARCGIS_FEATURE_LAYER_ID: ${{ secrets.ARCGIS_FEATURE_LAYER_ID }}
        run: |
          python Crash-Injury-Dashboard-Backend.py

      - name: Upload crashes.parquet to Release
        if: steps.freshness_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload data-latest crashes.parquet --clobber

      - name: Commit Timestamp File
        if: >-
          steps.freshness_check.outputs.skip != 'true' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.commit_timestamp))
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add last_record_timestamp.txt
          git commit -m "Update last_record_timestamp [skip ci]" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git push || echo "No changes to push"

      - name: Set up Git for Frontend Repo
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Clone Frontend Repo on dev Branch
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          git clone -b dev https://x-access-token:${{ secrets.FRONTEND_REPO_PAT }}@github.com/rafaelmorenoco/Crash-Injury-Dashboard-Frontend.git frontend

      - name: Copy crashes.parquet to Frontend Repo
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          cp crashes.parquet frontend/
          cd frontend
          git add crashes.parquet
          git commit -m "Update crashes.parquet data [skip ci]" || echo "No changes to commit"
          git push

      - name: Trigger Dispatch Event for Frontend Merge
        if: steps.freshness_check.outputs.skip != 'true'
        env:
          FRONTEND_TOKEN: ${{ secrets.FRONTEND_REPO_PAT }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $FRONTEND_TOKEN" \
            https://api.github.com/repos/rafaelmorenoco/Crash-Injury-Dashboard-Frontend/dispatches \
            -d '{"event_type": "update-crashes"}'
